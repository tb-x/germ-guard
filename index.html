<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Germ Guard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f9bfd0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Germ Guard">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap">
<style>
/* Layout: full-screen isometric board; portrait has the HUD bar on top and the Go button below, wide screens put both in a right-hand column */
:root{
  --ink:#5a1733;
  --panel:rgba(255,255,255,.9);
  --shade:rgba(150,40,80,.2);
  --drop:#39c2ff;
  --heart:#ff3b5c;
  --go:#3fcf6a;
  --go-dark:#23a14b;
  --gold:#ffd23f;
  --title:"Fredoka","Trebuchet MS",sans-serif;
  --plain:Verdana,Tahoma,sans-serif;
  --col:164px;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  font-family:var(--plain);color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  background:
    radial-gradient(circle at 12% 18%,rgba(255,255,255,.55) 0 38px,transparent 40px),
    radial-gradient(circle at 86% 30%,rgba(255,255,255,.35) 0 26px,transparent 28px),
    radial-gradient(circle at 78% 84%,rgba(255,255,255,.3) 0 46px,transparent 48px),
    radial-gradient(circle at 20% 76%,rgba(255,255,255,.25) 0 20px,transparent 22px),
    radial-gradient(120% 90% at 50% 30%,#ffeef3 0%,#f9bfd0 55%,#e07f9f 100%);
  background-color:#f9bfd0;
}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none;margin:0}
#safe{position:fixed;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);visibility:hidden;pointer-events:none}

/* ======== HUD ======== */
.bar{
  position:fixed;left:0;right:0;top:0;z-index:5;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 10px) 0 calc(env(safe-area-inset-left,0px) + 10px);
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;
}
.pill,.round{
  pointer-events:auto;height:48px;border-radius:24px;background:var(--panel);
  box-shadow:0 4px 0 var(--shade),0 8px 18px rgba(150,40,80,.15);
  display:flex;align-items:center;gap:6px;padding:0 12px;box-sizing:border-box;
}
.energy b{font:bold 24px/1 var(--plain);min-width:1.3em;text-align:left}
.energy svg{width:26px;height:26px}
.energy.bump{animation:bump .25s ease-out}
.hearts{gap:2px}
.hearts svg{width:20px;height:20px;transition:transform .2s,opacity .3s,filter .3s}
.hearts .lost{opacity:.3;filter:grayscale(1);transform:scale(.8)}
.waves{gap:5px}
.waves i{width:13px;height:13px;border-radius:50%;border:3px solid #e9a3b9;box-sizing:border-box}
.waves i.done{background:var(--go);border-color:var(--go-dark)}
.waves i.now{background:var(--gold);border-color:#e0a800;animation:pulse 1s ease-in-out infinite}
.round{width:48px;padding:0;justify-content:center;border:0;font-size:22px}
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none;
  height:calc(env(safe-area-inset-bottom,0px) + 104px);
  display:flex;justify-content:center;align-items:flex-start;padding-top:10px;box-sizing:border-box;
}
.go{
  pointer-events:auto;height:78px;min-width:176px;padding:0 30px;border-radius:39px;border:0;
  background:var(--go);color:#fff;font:700 36px/1 var(--title);letter-spacing:.02em;
  box-shadow:0 7px 0 var(--go-dark),0 12px 26px rgba(30,120,60,.3);
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.go:active{transform:translateY(4px);box-shadow:0 3px 0 var(--go-dark),0 6px 14px rgba(30,120,60,.3)}
.go.off{display:none}
.go.sneeze{min-width:0;width:112px;padding:0;font-size:46px;position:relative;overflow:hidden;background:#6cc8ff;box-shadow:0 7px 0 #2e8fd0,0 12px 26px rgba(30,100,160,.3)}
.go.sneeze::after{content:"";position:absolute;inset:0;border-radius:inherit;background:conic-gradient(rgba(20,40,90,.5) calc(var(--cd,0) * 360deg),transparent 0)}
.go.sneeze.ready{animation:ready 1.1s ease-in-out infinite}
@keyframes ready{50%{transform:scale(1.07)}}
.go svg{width:30px;height:30px}
.dock .round{position:absolute;left:calc(env(safe-area-inset-left,0px) + 14px);top:24px;font-size:20px}
body.wide .bar{
  left:auto;bottom:0;width:var(--col);box-sizing:content-box;
  flex-direction:column;flex-wrap:nowrap;justify-content:flex-start;align-items:stretch;
  padding:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-right,0px) + 12px) 0 0;
}
body.wide .pill{justify-content:center}
body.wide .dock{
  left:auto;width:var(--col);height:auto;top:auto;flex-direction:column-reverse;align-items:center;gap:14px;
  padding:0 calc(env(safe-area-inset-right,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 16px) 0;box-sizing:content-box;
}
body.wide .dock .round{position:static}
body.wide .go{min-width:0;width:100%;padding:0;font-size:32px}

/* ======== world labels, build menu, hint hand ======== */
.anchor{position:fixed;left:0;top:0;z-index:4;pointer-events:none;will-change:transform}
.preview{
  transform:translate(-50%,-100%);display:flex;gap:6px;align-items:center;white-space:nowrap;
  background:var(--panel);border-radius:18px;padding:5px 12px 5px 8px;
  box-shadow:0 3px 0 var(--shade);font:bold 20px/1 var(--plain);
}
.preview svg{width:30px;height:30px}
.preview svg.big{width:40px;height:40px}
.menu{z-index:6}
.opts{position:absolute;left:0;top:0;transform:translate(-50%,calc(-100% - 34px));display:flex;gap:10px}
.opts::after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-11px;border:11px solid transparent;border-bottom:0;border-top-color:#fff;filter:drop-shadow(0 4px 0 #e7a9bc)}
.opt{
  pointer-events:auto;position:relative;width:96px;min-height:108px;padding:8px 6px;border-radius:26px;border:0;background:#fff;
  box-shadow:0 5px 0 #e7a9bc,0 12px 26px rgba(120,30,60,.28);box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;animation:popin .18s ease-out;
}
.opt .pic{width:66px;height:66px}
.opt .cost{display:flex;flex-wrap:wrap;justify-content:center;gap:1px;max-width:82px}
.opt .cost svg{width:14px;height:14px}
.opt .badge{
  position:absolute;right:6px;top:6px;width:30px;height:30px;border-radius:50%;
  background:var(--go);color:#fff;font:bold 20px/30px var(--plain);box-shadow:0 2px 0 var(--go-dark);
}
.opt .pips{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:2px;font-size:12px;line-height:1}
.opt.poor .pic,.opt.poor .cost,.opt.poor .badge{filter:grayscale(.85);opacity:.6}
.opt.shake{animation:shake .4s}
.opts.many .opt{width:84px;min-height:100px}
.opts.many .opt .pic{width:56px;height:56px}
.hand{z-index:7}
.hand span{display:block;font-size:46px;line-height:1;transform:translate(-50%,0);animation:bob .7s ease-in-out infinite alternate;filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}
.hand.down span{transform:translate(-50%,-100%);animation-name:bobdown}
.fly{position:fixed;left:-15px;top:-15px;width:30px;height:30px;z-index:20;pointer-events:none;transition:transform .55s cubic-bezier(.45,-.35,.7,1)}
.fly svg{width:100%;height:100%}

/* ======== title and end cards ======== */
.overlay{
  position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  background:rgba(255,226,236,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
}
.card{
  background:#fff;border-radius:32px;padding:26px 22px 30px;text-align:center;max-width:340px;width:100%;
  box-shadow:0 8px 0 #eaa9bd,0 20px 50px rgba(120,30,60,.25);animation:popin .35s cubic-bezier(.3,1.6,.6,1);
}
.card h1{font:700 52px/1 var(--title);margin:4px 0 6px;color:var(--heart);text-shadow:0 4px 0 #ffd0dc}
.card h2{font:700 30px/1.15 var(--title);margin:6px 0 14px}
.card p{font:16px/1.4 var(--plain);margin:0 0 18px;color:#8a4a62}
.card .art{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:6px 0 10px}
.card .art svg{width:70px;height:70px}
.card .art svg.mid{width:88px;height:88px}
.stars{font-size:46px;letter-spacing:4px;margin:-4px 0 16px}
.stars .off{filter:grayscale(1);opacity:.3}
.card .go{margin:0 auto}
/* the level map: a body with a glowing spot per level */
.title-card{padding-top:20px;position:relative}
.row .round.vibe{font-size:24px;box-shadow:0 4px 0 var(--shade)}
.vibe.off{filter:grayscale(1);opacity:.45}
.title-card h1{font-size:46px}
.title-card p{margin-bottom:6px}
.bodymap{position:relative;width:min(270px,70vw);aspect-ratio:200/260;margin:0 auto 12px}
.bodymap svg.body{position:absolute;inset:0;width:100%;height:100%}
.spot{
  position:absolute;transform:translate(-50%,-50%);width:48px;height:48px;padding:0;border-radius:50%;
  border:3px solid #fff;background:#fff6c9;box-shadow:0 3px 0 #e0a800;font-size:24px;line-height:1;display:grid;place-items:center;
}
.spot b{position:absolute;right:-8px;top:-8px;width:22px;height:22px;border-radius:50%;background:var(--heart);color:#fff;font:bold 13px/22px var(--plain)}
.spot .st{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;font-size:12px;letter-spacing:-1px;white-space:nowrap}
.spot .st i{font-style:normal;filter:grayscale(1);opacity:.35}
.spot.locked{background:#f1e6ea;box-shadow:0 3px 0 #cdb5be;filter:grayscale(1);opacity:.7}
.spot.next{animation:glow 1.3s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 3px 0 #e0a800,0 0 0 12px rgba(255,210,63,.4)}}
@media (orientation:landscape) and (max-height:620px){   /* a phone on its side: words and Play on the left, the body on the right */
  .title-card{max-width:600px;display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:20px;padding:16px 22px}
  .title-card .bodymap{grid-column:2;grid-row:1 / span 3;width:auto;height:calc(100vh - 90px);max-height:330px;margin:0}
  .title-card h1{font-size:40px}
}
.row{display:flex;gap:10px;justify-content:center;align-items:center}
.row .go{margin:0;min-width:0;padding:0 22px;font-size:30px;white-space:nowrap;flex:0 1 auto}
.row .round{width:58px;height:58px;font-size:0;flex:none}
.row .round svg{width:30px;height:30px}
.dock .round.home{left:auto;right:calc(env(safe-area-inset-right,0px) + 14px)}
.dock .round.home svg{width:24px;height:24px}

@keyframes pulse{50%{transform:scale(1.3)}}
@keyframes bump{50%{transform:scale(1.18)}}
@keyframes bob{to{transform:translate(-50%,12px)}}
@keyframes bobdown{to{transform:translate(-50%,calc(-100% - 12px))}}
@keyframes popin{from{transform:scale(.6);opacity:0}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="safe"></div>

<div class="bar" id="bar">
  <div class="pill energy" id="energyPill" aria-label="Energy drops"><span id="energyIcon"></span><b id="energy">0</b></div>
  <div class="pill hearts" id="hearts" aria-label="Heart sparkles"></div>
  <div class="pill waves" id="waves" aria-label="Waves"></div>
</div>
<div class="dock" id="dock">
  <button class="go" id="go" aria-label="Send the next wave">Go!</button>
  <button class="go sneeze off" id="sneeze" aria-label="Sneeze the germs away">🤧</button>
  <button class="round" id="mute" aria-label="Sound on or off">🔊</button>
  <button class="round home" id="home" aria-label="Back to the map"></button>
</div>

<div id="labels"></div>
<div class="anchor menu" id="menu" hidden><div class="opts" id="opts"></div></div>
<div class="anchor hand" id="hand" hidden><span>👆</span></div>

<div class="overlay" id="title">
  <div class="card title-card">
    <h1>Germ Guard</h1>
    <p>Build white blood cells. Stop the germs before they reach the heart!</p>
    <div class="bodymap" id="bodymap"></div>
    <div class="row">
      <button class="go" id="play" aria-label="Play"></button>
      <button class="round vibe" id="vibe" aria-label="Vibration on or off" hidden>📳</button>
    </div>
  </div>
</div>
<div class="overlay" id="end" hidden>
  <div class="card">
    <div class="art" id="endArt"></div>
    <h2 id="endTitle"></h2>
    <div class="stars" id="stars"></div>
    <div class="row">
      <button class="round" id="mapBtn" aria-label="Back to the map"></button>
      <button class="round" id="againBtn" aria-label="Play this level again"></button>
      <button class="go" id="endBtn"></button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js';

/* ======== tuning knobs ======== */
const HEART_SPARKLES = 5;       // germs that may reach the heart before the wave has to be tried again
const WAVE_BONUS = 3;           // drops that pop out of the heart after each cleared wave
const DROP_AUTOCOLLECT_S = 4;   // a drop nobody taps flies to the counter on its own after this long
const SHOT_SPEED = 9;           // zapper shots, tiles per second
const BUILDS = {                // what can go on a pad: cost in drops, then the stats for levels 1, 2 and 3
  zapper: { cost: 5, levels: [   // shoots: reach in tiles, seconds between shots, damage per shot
    { range: 2.7, reload: 0.85, damage: 1 },
    { range: 2.9, reload: 0.6,  damage: 1 },
    { range: 3.1, reload: 0.8,  damage: 2 },
  ] },
  nest: { cost: 6, levels: [     // trains blobs: how far from the nest they stand guard, damage per second, how long they can hold germs
    { reach: 2.3, dps: 1.8, stamina: 8 },
    { reach: 2.5, dps: 2.4, stamina: 11 },
    { reach: 2.7, dps: 3.0, stamina: 14 },
  ] },
};
BUILDS.antibody = { cost: 6, levels: [   // sticks antibodies on germs: reach in tiles, seconds between shots, germs per shot
  { range: 2.8, reload: 1.4, multi: 1 },
  { range: 3.0, reload: 1.0, multi: 1 },
  { range: 3.2, reload: 0.9, multi: 2 },
] };
const TAG_SLOW = 0.7;           // a germ with an antibody stuck on walks at this fraction of its speed...
const TAG_DAMAGE = 1.5;         // ...and takes this much more damage
const AB_SPEED = 6;             // antibody flying speed, tiles per second
const MUCUS_COST = 4;           // a snot puddle on the vessel
const MUCUS_MAX = 3;            // snot puddles per level
const MUCUS_R = 0.6;            // how far a puddle reaches, in tiles
const MUCUS_SLOW = 0.4;         // germs in snot walk at this fraction of their speed
const SNEEZE_COOLDOWN = 40;     // seconds before the sneeze button works again
const SNEEZE_PUSH = 5;          // tiles every germ gets blown back
const UPGRADE_COSTS = [6, 9];   // drops to go to level 2, then level 3
const TROOP_COST = 2;           // drops to train one more blob (a new nest comes with one)
const TROOPS_PER_NEST = 3;
const TRAIN_S = 1.2;            // seconds to train a blob
const TROOP_SPEED = 1.8;        // blob walking speed, tiles per second
const TROOP_GUARD_R = 1.0;      // a blob grabs germs this close to its post (tiles)
const TROOP_REST_S = 4;         // a tired blob rests in the nest this long
const CHOMP_S = 0.4;            // seconds between bites
const TROOP_RECOVER = 1;        // stamina a blob gets back per second while it waits at its post
const GERMS = {                 // hp, walking speed (tiles per second), drops when popped, body radius (tiles), how fast it tires a blob, look
  bloop:     { hp: 4,  speed: 0.85, drops: 1, size: 0.32, bite: 1,   shape: 'blob',   color: 0x8fd14f, bump: 0x5f9e33 },
  big:       { hp: 12, speed: 0.6,  drops: 3, size: 0.48, bite: 2.5, shape: 'blob',   color: 0x7cc84d, bump: 0x4c8a2a },
  wiggler:   { hp: 2,  speed: 1.5,  drops: 1, size: 0.3,  bite: 0.8, shape: 'rod',    color: 0xffcf3f, bump: 0xe39b17 },
  corkscrew: { hp: 4,  speed: 1.1,  drops: 1, size: 0.34, bite: 1,   shape: 'spiral', color: 0x2bb3a3, bump: 0x1d8478, slippery: true },   // too wiggly for blobs to grab
  chunky:    { hp: 14, speed: 0.5,  drops: 2, size: 0.5,  bite: 2,   shape: 'clump',  color: 0x9aa83e, bump: 0x6c7a24, splits: 3 },         // breaks into 3 bloops
  spiky:     { hp: 6,  speed: 0.75, drops: 2, size: 0.34, bite: 1.5, shape: 'virus',  color: 0x9b5de5, bump: 0xffd23f, armour: true },     // nothing hurts it until an antibody sticks
  king:      { hp: 130, speed: 0.4, drops: 12, size: 0.72, bite: 4, shape: 'king',   color: 0x4f9a3a, bump: 0x2f6e22, splits: 4, hurts: 3 },   // the boss: costs 3 hearts if it gets through
};
const GERM_HELLO = {            // said the first time each kind shows up in a wave
  big: 'A big germ is coming! It takes lots of pops.',
  wiggler: 'Watch out for the wigglers. They are fast!',
  corkscrew: 'Corkscrew germs are too wiggly for the blobs to grab!',
  chunky: 'A chunky germ! When it pops, it breaks into little ones.',
  spiky: 'Spiky germs have armour! Stick an antibody on them first.',
  king: 'Uh oh, it is the King Germ! It is huge. Use everything you have!',
};
for (const [kind, k] of Object.entries(GERMS)) k.kind = kind;
const CAM_PITCH = 38;           // camera angle above the ground in degrees (true isometric is 35.3)

/* ======== levels ======== */
// Map key: ' ' nothing, '.' tissue, '#' blood vessel, '1'-'9' where germs get in, 'H' the heart, 'o' build pad.
// The board is seen corner-on, so the map's top-left to bottom-right diagonal runs down the screen.
// Waves are lists of groups: germ kind, how many, seconds apart, optional start delay, and which entry ('from', 0 = '1').
const LEVELS = [
  {
    name: 'Scraped Knee', icon: '🦵', seed: 7, entry: 'scratch', startEnergy: 10, builds: ['zapper'],
    map: [
      ' ..1...         ',
      ' ..#....        ',
      ' ..#.o...       ',
      ' ..#.....o      ',
      ' ..######..     ',
      '  ......#...    ',
      '   ...o.#....   ',
      '    ....#.o...  ',
      '     ...#...... ',
      '      ..######..',
      '       o.....#..',
      '        ...o.#..',
      '         ....#..',
      '          ...H..',
      '           .....',
      '            ....',
    ],
    waves: [
      [{ kind: 'bloop', n: 6,  gap: 1.6 }],
      [{ kind: 'bloop', n: 9,  gap: 1.2 }],
      [{ kind: 'bloop', n: 12, gap: 1.0 }],
      [{ kind: 'bloop', n: 10, gap: 1.0 }, { kind: 'big', n: 3, gap: 3, delay: 3 }],
      [{ kind: 'bloop', n: 16, gap: 0.8 }, { kind: 'big', n: 4, gap: 2.5, delay: 4 }],
    ],
    intro: 'Oh no, a scratch on the knee! Germs are sneaking in. Tap a glowing spot to build a germ zapper.',
    win: 'Hooray! You stopped all the germs. The knee is all better!', winTitle: 'The knee is all better!',
  },
  {
    name: 'Runny Nose', icon: '👃', seed: 11, entry: 'nostril', startEnergy: 14, builds: ['zapper', 'nest'], sneeze: true, hint: [8, 8, 'nest'],
    map: [
      '    ...          ',
      '   .2##.         ',
      '  ....#.o        ',
      ' .....#...       ',
      '.1....####.      ',
      '.#...o...#..     ',
      '.####....#..     ',
      ' ...#....#..     ',
      '  o.#...o#....   ',
      '   .######....   ',
      '    .....#.o...  ',
      '     ..o.#.....  ',
      '      ...####..  ',
      '       .....#..  ',
      '        ....H..  ',
      '          .....  ',
      '          .....  ',
    ],
    waves: [
      [{ kind: 'bloop', n: 4, gap: 1.8, from: 0 }, { kind: 'bloop', n: 4, gap: 1.8, delay: 0.9, from: 1 }],
      [{ kind: 'bloop', n: 7, gap: 1.3, from: 0 }, { kind: 'bloop', n: 5, gap: 1.6, delay: 3, from: 1 }],
      [{ kind: 'bloop', n: 5, gap: 1.4, from: 0 }, { kind: 'bloop', n: 9, gap: 1.0, delay: 1, from: 1 }, { kind: 'big', n: 2, gap: 4, delay: 6, from: 0 }],

    const rim = new THREE.Mesh(new THREE.TorusGeometry(holeR + 0.02, style === 'scratch' ? 0.07 : style === 'mouth' ? 0.13 : 0.1, 8, 28).rotateX(Math.PI / 2), rimMat);

  const entryMid = board.entries.reduce((v, e) => v.add(e.path[0]), new THREE.Vector3()).divideScalar(board.entries.length);

// Same approach as math5/haptics.js. Android: navigator.vibrate patterns. iPhone/iPad (iOS 18+): no vibrate API,
// but clicking a hidden native <input type="checkbox" switch> gives a system tap; iOS only plays those in response
// to a touch, so buzzes that happen on their own (a germ reaching the heart) may stay silent there.
const Haptics = (() => {
  const PATTERNS = {   // [buzz ms, pause ms, buzz ms, ...]
    tap: [8], build: [20], nope: [30, 40, 30], go: [25, 40, 40], pop: [15],
    ouch: [70, 60, 70], sneeze: [30, 40, 30, 40, 250], boss: [200, 80, 200, 80, 300],
    win: [50, 70, 50, 70, 180], lose: [120, 80, 120],

  const canVibrate = touch && typeof navigator.vibrate === 'function';

  const useSwitch = !canVibrate && isIOS;

    buzz(name) {

// Only clean tones, no noise loops. It dips while the voice is talking.
const MUSIC_VOL = 0.15;         // overall music level
const MUSIC_DUCK = 0.35;        // music level (fraction) while the voice talks

  build: { bpm: 92,  bars: MAJOR, tune: [72, 74, 76, 79, 81], drums: false, busy: 0.22, bass: [0, 8] },
  wave:  { bpm: 124, bars: MAJOR, tune: [72, 74, 76, 79, 81, 84], drums: true, busy: 0.4, bass: [0, 3, 6, 8, 11, 14] },
  boss:  { bpm: 110, bars: MINOR, tune: [69, 71, 72, 76, 77], drums: true, busy: 0.35, bass: [0, 2, 4, 8, 10, 12] },

/* ======== germs ======== */

/* ======== defenders: zappers and nests ======== */
function buildStruct(pad, kind) {
  const m = kind === 'nest' ? makeNest() : kind === 'antibody' ? makeFactory() : makeZapper();
  const t = { kind, level: 1, pad, ...m, ranks: [], cool: 0.4, born: 0, kick: 0, trainQ: 0, trainT: 0 };
  t.group.position.set(pad.x, pad.top + 0.08, pad.z);
  t.aim.rotation.y = view.yaw; t.group.scale.setScalar(0.01);
  pad.tower = t; pad.plus.visible = pad.ring.visible = false;

  burst(new THREE.Vector3(pad.x, pad.top + 0.3, pad.z), 8, 0.3, [MAT.shot], 2.5);
}
function upgradeStruct(t) {
  t.level++; t.born = 0.45; t.kick = 1;
  const rank = new THREE.Mesh(RANK_GEO, MAT.gold); rank.position.y = 0.07 + 0.09 * (t.level - 2); t.group.add(rank); t.ranks.push(rank);
  if (t.kind === 'nest') for (const b of game.troops) if (b.nest === t) { b.stamina = stats(t).stamina; b.mesh.scale.setScalar(troopScale(t)); }
  burst(t.group.position.clone().setY(t.pad.top + 0.6), 12, 0.3, [MAT.gold], 3);
}
function choosePost(t) {   // the vessel tile the nest's blobs guard: close by, preferring tiles where paths merge

  for (const c of board.land) {

    const d = Math.hypot(c.x - t.pad.x, c.z - t.pad.z);
    if (d > stats(t).reach) continue;
    const score = d - 0.6 * (c.paths - 1);

  }
  if (!best) best = board.land.filter(c => c.paths).reduce((a, c) => (Math.hypot(c.x - t.pad.x, c.z - t.pad.z) < Math.hypot(a.x - t.pad.x, a.z - t.pad.z) ? c : a));

function setDoor(t) {   // the nest's door faces the viewer; blobs come out and go home through it

}
function buildTrap(cell) {

  const tr = { cell, mesh, born: 0 }; cell.trap = tr;
  scene.add(mesh); game.traps.push(tr);
  burst(new THREE.Vector3(cell.x, ROAD_Y + 0.3, cell.z), 8, 0.3, [MAT.mucus], 2);
}
const TROOP_SLOTS = [[0, 0], [0.34, 0.2], [-0.28, 0.3]];
const troopScale = nest => 1.3 * (1 + 0.12 * (nest.level - 1));
function spawnTroop(nest) {
  const m = makeTroop(), slot = game.troops.filter(b => b.nest === nest).length;
  const b = { nest, ...m, slot, state: 'walk', stamina: stats(nest).stamina, foe: null, chompT: 0, chomp: 0, restT: 0, phase: Math.random() * 6 };
  b.mesh.position.copy(nest.door).setY(groundY(nest.door.x, nest.door.z));
  b.mesh.scale.setScalar(troopScale(nest));

function postOf(b) { const [dx, dz] = TROOP_SLOTS[b.slot % 3]; return new THREE.Vector3(b.nest.post.x + dx, 0, b.nest.post.z + dz); }
function moveTo(b, target, speed, dt) {   // walk towards a point; true once there

  if (d > 0.02) b.mesh.rotation.y = lerpAngle(b.mesh.rotation.y, Math.atan2(dx, dz), damp(10, dt));

function updateTroops(dt) {
  const fighting = game.state === 'wave';

    const st = stats(b.nest);

    if (b.state === 'guard') {
      b.stamina = Math.min(st.stamina, b.stamina + dt * TROOP_RECOVER);
      b.mesh.rotation.y = lerpAngle(b.mesh.rotation.y, view.yaw, damp(4, dt));

        b.mesh.rotation.y = lerpAngle(b.mesh.rotation.y, Math.atan2(gp.x - b.mesh.position.x, gp.z - b.mesh.position.z), damp(12, dt));
        b.chompT += dt;
        if (b.chompT >= CHOMP_S) { b.chompT = 0; b.chomp = 1; Sound.nom(); damageGerm(g, st.dps * CHOMP_S); }
        b.stamina -= g.k.bite * dt;

      }

    } else if (b.state === 'rest') {

}
function updateTowers(dt) {
  for (const t of game.towers) {

    t.kick = Math.max(0, t.kick - dt * 5);

    if (t.kind === 'nest') {

      const near = game.germs.filter(g => !g.tagged && !g.abIncoming && g.leaving < 0 && g.rise >= 0.6 && g.hp > 0
        && (g.mesh.position.x - t.group.position.x) ** 2 + (g.mesh.position.z - t.group.position.z) ** 2 <= R2)
        .sort((a, b) => (b.k.armour ? 1 : 0) - (a.k.armour ? 1 : 0) || b.dist - a.dist);

/* ======== drops ======== */

    } else {

    }

  el.style.transform = `translate(${p.x}px,${p.y}px) scale(1.2)`;
  document.body.append(el);
  const to = $('energyIcon').getBoundingClientRect();
  requestAnimationFrame(() => requestAnimationFrame(() => { el.style.transform = `translate(${to.left + to.width / 2}px,${to.top + to.height / 2}px) scale(.8)`; }));
  setTimeout(() => {
    el.remove(); if (run !== game.run) return;
    game.energy++; Sound.collect(); updateHud();
    const pill = $('energyPill'); pill.classList.remove('bump'); void pill.offsetWidth; pill.classList.add('bump');
  }, 560);
}

/* ======== HUD and menus ======== */
$('energyIcon').innerHTML = SVG.drop;
$('play').innerHTML = SVG.play + 'Play';
$('againBtn').innerHTML = SVG.again('#c2456c');
$('mapBtn').innerHTML = $('home').innerHTML = SVG.home('#c2456c');
$('mute').textContent = Sound.muted ? '🔇' : '🔊';

function updateHud() {
  $('energy').textContent = game.energy;
  $('hearts').innerHTML = Array.from({ length: HEART_SPARKLES }, (_, i) => SVG.heart.replace('<svg', `<svg class="${i < game.sparkles ? '' : 'lost'}"`)).join('');
  $('waves').innerHTML = LEVEL.waves.map((_, i) => `<i class="${i < game.wave ? 'done' : i === game.wave && game.state !== 'won' ? 'now' : ''}"></i>`).join('');
  $('go').classList.toggle('off', game.state !== 'build');
  $('sneeze').classList.toggle('off', !(game.state === 'wave' && LEVEL.sneeze));
  for (const o of $('opts').children) o.classList.toggle('poor', game.energy < +o.dataset.cost);
}
function showPreview() {   // which germs come next out of each entry, shown while building
  const on = game.state === 'build';
  entryFx.forEach((fx, i) => {
    const counts = {};
    if (on) for (const gr of LEVEL.waves[game.wave]) if ((gr.from || 0) === i) counts[gr.kind] = (counts[gr.kind] || 0) + gr.n;
    const any = Object.keys(counts).length > 0;
    fx.arrow.visible = any; fx.label.hidden = !any;
    if (on) for (const k of Object.keys(counts)) if (!game.seen.has(k)) { game.seen.add(k); if (GERM_HELLO[k]) Speech.say(GERM_HELLO[k], true); }
    fx.label.firstElementChild.innerHTML = Object.entries(counts).map(([k, n]) => `${germIcon(k)}<span>×${n}</span>`).join('&nbsp;');
  });
}
function menuOptions(pad) {   // the choices for a pad: build something, or improve what's there; on a vessel tile, snot
  if (pad.ch !== 'o') {
    const left = MUCUS_MAX - game.traps.length;
    return LEVEL.mucus && !pad.trap && left > 0 ? [{ act: 'build', kind: 'mucus', cost: MUCUS_COST, pic: SVG.mucus('pic'), pips: '🟢'.repeat(left) }] : [];
  }
  const t = pad.tower;
  if (!t) return LEVEL.builds.map(kind => ({ act: 'build', kind, cost: BUILDS[kind].cost, pic: SVG[kind]('pic') }));
  const opts = [];
  if (t.kind === 'nest' && game.troops.filter(b => b.nest === t).length + t.trainQ < TROOPS_PER_NEST) {
    opts.push({ act: 'train', kind: '', cost: TROOP_COST, pic: SVG.troop('pic'), badge: '+' });
  }
  if (t.level < 3) opts.push({ act: 'upgrade', kind: '', cost: UPGRADE_COSTS[t.level - 1], pic: SVG[t.kind]('pic'), badge: '▲', pips: '⭐'.repeat(t.level) });
  return opts;
}
function openMenu(pad, refresh = false) {
  const opts = menuOptions(pad);
  if (!opts.length) { closeMenu(); return false; }
  game.menuSpot = pad; $('menu').hidden = false;
  $('opts').innerHTML = opts.map(o => `<button class="opt" data-act="${o.act}" data-kind="${o.kind}" data-cost="${o.cost}" aria-label="${o.act} ${o.kind}">`
    + (o.pips ? `<span class="pips">${o.pips}</span>` : '') + o.pic + (o.badge ? `<span class="badge">${o.badge}</span>` : '')
    + `<span class="cost">${SVG.drop.repeat(o.cost)}</span></button>`).join('');
  $('opts').classList.toggle('many', opts.length > 2);
  const t = pad.tower;
  if (pad.ch !== 'o') showRing(pad.x, ROAD_Y + 0.03, pad.z, MUCUS_R);
  else if (t && t.kind === 'nest') showRing(t.post.x, groundY(t.post.x, t.post.z) + 0.04, t.post.z, TROOP_GUARD_R);
  else showRing(pad.x, pad.top + 0.06, pad.z, (t ? stats(t) : BUILDS.zapper.levels[0]).range);
  updateHud(); if (!refresh) Sound.tap();
  return true;
}
function closeMenu() { game.menuSpot = null; $('menu').hidden = true; rangeRing.visible = false; }
function act(button) {
  const pad = game.menuSpot; if (!pad) return;
  const { act: action, kind } = button.dataset, cost = +button.dataset.cost;
  if (game.energy < cost) {
    button.classList.remove('shake'); void button.offsetWidth; button.classList.add('shake');
    Sound.nope();
    if (game.time - Speech.lastNope > 5) { Speech.lastNope = game.time; Speech.say('Pop germs to get more drops!'); }
    return;
  }
  game.energy -= cost;
  if (action === 'build' && kind === 'mucus') {
    buildTrap(pad); closeMenu(); Sound.splat();
  } else if (action === 'build') {
    buildStruct(pad, kind); closeMenu(); Sound.build();
    if (game.tutorial && game.towers.length === 1) Speech.say(kind === 'nest' ? 'A blob nest! Its blobs will wait by the vessel. Tap Go when you\'re ready.' : 'Great! Tap Go when you\'re ready.');
  } else if (action === 'upgrade') {
    upgradeStruct(pad.tower); Sound.upgrade(); openMenu(pad, true);
  } else if (action === 'train') {
    pad.tower.trainQ++; pad.tower.kick = 1; Sound.tap(); openMenu(pad, true);
  }
  updateHud();
}
$('opts').addEventListener('click', e => { const b = e.target.closest('.opt'); if (b) act(b); });

const starsFor = hearts => hearts >= HEART_SPARKLES ? 3 : hearts >= 3 ? 2 : 1;
function showEnd(kind) {
  const won = kind === 'won', stars = starsFor(game.sparkles);
  const next = won && levelIndex + 1 < LEVELS.length;
  $('endArt').innerHTML = won ? SVG.heart.replace('<svg', '<svg class="mid"') : SVG.bloop('mid');
  $('endTitle').textContent = won ? LEVEL.winTitle : 'Achoo! Germs got through.';
  $('stars').hidden = !won;
  $('stars').innerHTML = [0, 1, 2].map(i => `<span class="${i < stars ? '' : 'off'}">⭐</span>`).join('');
  $('endBtn').innerHTML = next ? SVG.play + 'Next' : won ? SVG.again() + 'Again' : SVG.again() + 'Try again';
  $('endBtn').dataset.do = next ? 'next' : won ? 'again' : 'retry';
  $('againBtn').hidden = !next;
  $('mapBtn').hidden = false;
  $('end').hidden = false;
}
// The level map: a child's outline with a spot where each level happens (knee, nose, tummy, lungs, and a thermometer for the fever)
const MAP_SPOTS = [[78, 222], [100, 54], [100, 154], [100, 112], [160, 26]];
const BODY_SVG = `<svg class="body" viewBox="0 0 200 260" aria-hidden="true">
  <g stroke="#e9a48c" stroke-width="20" stroke-linecap="round"><path d="M67 96 38 150M133 96l29 54M86 168l-6 72M114 168l6 72"/></g>
  <g stroke="#ffd9c7" stroke-width="14" stroke-linecap="round"><path d="M67 96 38 150M133 96l29 54M86 168l-6 72M114 168l6 72"/></g>
  <rect x="62" y="80" width="76" height="96" rx="30" fill="#ffd9c7" stroke="#e9a48c" stroke-width="3"/>
  <circle cx="100" cy="44" r="34" fill="#ffd9c7" stroke="#e9a48c" stroke-width="3"/>
  <path d="M112 104s-9-6-9-12a5 5 0 0 1 9-2 5 5 0 0 1 9 2c0 6-9 12-9 12z" fill="#ff8fa6" opacity=".55"/>
  <path d="M128 36q14-10 22-12" stroke="#e9a48c" stroke-width="3" stroke-dasharray="4 5" fill="none" stroke-linecap="round"/>
</svg>`;
function renderMap() {
  const next = Math.min(game.unlocked, LEVELS.length - 1);
  $('bodymap').innerHTML = BODY_SVG + LEVELS.map((L, i) => {
    const [x, y] = MAP_SPOTS[i], locked = i > game.unlocked, got = game.stars[i] || 0;
    const stars = locked ? '' : `<span class="st">${[0, 1, 2].map(k => k < got ? '⭐' : '<i>⭐</i>').join('')}</span>`;
    return `<button class="spot ${locked ? 'locked' : ''} ${i === next && !got ? 'next' : ''}" style="left:${x / 2}%;top:${y / 2.6}%" data-i="${i}" aria-label="Level ${i + 1}: ${L.name}">`
      + `${locked ? '🔒' : L.icon}<b>${i + 1}</b>${stars}</button>`;
  }).join('');
}
function playLevel(i) {   // from the map: load a level and start it
  Sound.init(); $('title').hidden = true; $('end').hidden = true;
  Speech.say(LEVELS[i].intro);
  if (i !== levelIndex) loadLevel(i); else startLevel();
}
$('bodymap').addEventListener('click', e => {
  const b = e.target.closest('.spot'); if (!b) return;
  const i = +b.dataset.i;
  if (i > game.unlocked) { Sound.init(); Sound.nope(); return; }
  playLevel(i);
});
function goHome() {   // back to the map; the level in progress is dropped
  game.run++; clearField(); clearStructures(); closeMenu();
  game.state = 'title'; showPreview(); updateHud();
  if (window.speechSynthesis) speechSynthesis.cancel();
  $('end').hidden = true; renderMap(); $('title').hidden = false;
}
function hintTarget() {   // the pointing hand: the sneeze button when germs get close, the first build of a level, then (level 1) Go
  if (!$('end').hidden || !$('title').hidden) return null;
  if (game.sneezeHint > 0 && game.state === 'wave') { const r = $('sneeze').getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top - 6, up: false }; }
  if (game.state !== 'build' || game.wave !== 0) return null;
  if (game.towers.length + game.traps.length === 0) {
    const [hc, hr, kind] = LEVEL.hint || [bestPad.c, bestPad.r, 'zapper'];
    const pad = board.cells.get(hc + ',' + hr) || bestPad;
    if (game.menuSpot === pad) {
      const o = [...$('opts').children].find(b => b.dataset.kind === kind) || $('opts').firstElementChild;
      const r = o.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.bottom + 6, up: true };
    }
    const p = toScreen(pad.x, pad.top, pad.z); return { x: p.x + 6, y: p.y + 12, up: true };
  }
  if (levelIndex === 0 && game.tutorial) { const r = $('go').getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top - 6, up: false }; }
  return null;
}
function updateAnchors() {
  for (const fx of entryFx) {
    if (fx.label.hidden) continue;
    const p = toScreen(fx.cell.x, 1.75, fx.cell.z), box = fx.label.firstElementChild, half = box.offsetWidth / 2 + 6;
    const minY = (document.body.classList.contains('wide') ? 0 : $('bar').getBoundingClientRect().bottom) + box.offsetHeight + 6;
    const x = Math.max(half, Math.min(innerWidth - half, p.x)), y = Math.max(minY, p.y);   // keep it on screen, clear of the HUD
    fx.label.style.transform = `translate(${x}px,${y}px)`;
  }
  const sz = $('sneeze');
  if (!sz.classList.contains('off')) { sz.style.setProperty('--cd', Math.max(0, game.sneezeCd) / SNEEZE_COOLDOWN); sz.classList.toggle('ready', game.sneezeCd <= 0); }
  if (game.menuSpot) {
    const pad = game.menuSpot, p = toScreen(pad.x, pad.top + 0.1, pad.z), half = $('opts').offsetWidth / 2 + 8;
    const x = Math.max(half, Math.min(innerWidth - half, p.x)), y = Math.max(150, p.y);
    $('menu').style.transform = `translate(${x}px,${y}px)`;
  }
  const hint = hintTarget();
  $('hand').hidden = !hint;
  if (hint) {
    $('hand').classList.toggle('down', !hint.up); $('hand').firstElementChild.textContent = hint.up ? '👆' : '👇';
    $('hand').style.transform = `translate(${hint.x}px,${hint.y}px)`;
  }
}

/* ======== input ======== */
let press = null, ringTimer = 0;
const raycaster = new THREE.Raycaster(), roadPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -ROAD_Y);
function groundAt(x, y) {   // the point on the vessel floor under a screen position
  raycaster.setFromCamera(new THREE.Vector2(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1), camera);
  return raycaster.ray.intersectPlane(roadPlane, new THREE.Vector3());
}
canvas.addEventListener('pointerdown', e => { press = { x: e.clientX, y: e.clientY, id: e.pointerId }; });
canvas.addEventListener('pointercancel', () => { press = null; });
canvas.addEventListener('pointerup', e => {
  if (!press || press.id !== e.pointerId) return;
  const moved = Math.hypot(e.clientX - press.x, e.clientY - press.y); press = null;
  if (moved < 16) onTap(e.clientX, e.clientY);
});
function onTap(x, y) {
  if (game.state === 'title') return;
  Sound.init();
  // drops first: grab every drop near the finger
  const dropR = Math.max(46, view.ppu * 0.7);
  const hits = game.drops.filter(d => { const p = toScreen(d.mesh.position.x, d.mesh.position.y, d.mesh.position.z); return Math.hypot(p.x - x, p.y - y) < dropR; });
  if (hits.length) { hits.forEach(collectDrop); return; }
  if (game.state === 'won' || game.state === 'lost') return;
  // then the nearest build pad
  const padR = Math.max(42, view.ppu * 0.8);
  let best = null, bestD = padR;
  for (const pad of board.pads) {
    const p = toScreen(pad.x, pad.top + 0.2, pad.z), d = Math.hypot(p.x - x, p.y - y);
    if (d < bestD) { best = pad; bestD = d; }
  }
  if (!best && LEVEL.mucus) {   // no pad: maybe a vessel tile, for a snot puddle
    const g = groundAt(x, y), cell = g && board.cells.get(Math.round(g.x) + ',' + Math.round(g.z));
    if (cell && cell.paths && cell.ch === '#') {
      if (game.menuSpot === cell) { closeMenu(); return; }
      if (!openMenu(cell)) { closeMenu(); Sound.nope(); }
      return;
    }
  }
  if (!best || game.menuSpot === best) { closeMenu(); return; }
  if (best.tower) best.tower.kick = 1;
  if (!openMenu(best)) {   // a fully upgraded zapper: just show its reach and give a happy wiggle
    Sound.tap(); showRing(best.x, best.top + 0.06, best.z, stats(best.tower).range);
    clearTimeout(ringTimer); ringTimer = setTimeout(() => { if (!game.menuSpot) rangeRing.visible = false; }, 1200);
  }
}
$('go').addEventListener('click', () => { Sound.init(); startWave(); });
$('sneeze').addEventListener('click', () => { Sound.init(); if (game.sneezeCd > 0) Sound.nope(); else sneeze(); });
$('play').addEventListener('click', () => playLevel(Math.min(game.unlocked, LEVELS.length - 1)));
$('home').addEventListener('click', () => { Sound.init(); Sound.tap(); goHome(); });
$('mapBtn').addEventListener('click', () => { Sound.init(); Sound.tap(); goHome(); });
$('endBtn').addEventListener('click', () => {
  Sound.init(); $('end').hidden = true;
  const what = $('endBtn').dataset.do;
  if (what === 'next') playLevel(levelIndex + 1);
  else if (what === 'again') { startLevel(); Speech.say('Here we go again!'); }
  else { retryWave(); Speech.say('Build more, then tap Go.'); }
});
$('againBtn').addEventListener('click', () => { Sound.init(); $('end').hidden = true; startLevel(); Speech.say('Here we go again!'); });
if (Haptics.supported) {
  const vibe = $('vibe'), show = () => vibe.classList.toggle('off', !Haptics.isOn());
  vibe.hidden = false; show();
  vibe.addEventListener('click', () => { Haptics.setOn(!Haptics.isOn()); show(); Haptics.buzz('build'); Sound.init(); Sound.tap(); });
}
$('mute').addEventListener('click', () => {
  Sound.muted = !Sound.muted; store.set('muted', Sound.muted);
  $('mute').textContent = Sound.muted ? '🔇' : '🔊';
  if (Sound.muted && window.speechSynthesis) speechSynthesis.cancel();
  if (Sound.muted) Music.stop(0.2);
  Sound.init(); Sound.tap();
});

/* ======== loop ======== */
const dummy = new THREE.Object3D();
function updateWorld(dt) {
  game.time += dt;
  if (game.state === 'wave') {
    game.waveT += dt;
    while (game.queue.length && game.queue[0].t <= game.waveT) { const q = game.queue.shift(); spawnGerm(q.kind, board.entries[q.from].path); }
    // the first time germs get most of the way on a sneeze level, point at the sneeze button
    if (LEVEL.sneeze && !game.sneezeHinted && game.sneezeCd <= 0 && game.germs.some(g => g.dist > g.path.length * 0.6)) {
      game.sneezeHinted = true; game.sneezeHint = 5; Speech.say('Quick! Press the sneeze button!');
    }
  }
  if (game.state !== 'title') game.sneezeCd = Math.max(0, game.sneezeCd - dt);
  game.sneezeHint = Math.max(0, game.sneezeHint - dt);
  if (game.sneezeAt && game.time >= game.sneezeAt) { game.sneezeAt = 0; blowBack(); }
  if (LEVEL.fever && game.state !== 'title' && Math.random() < dt * 4) {   // heat shimmer: little wisps rising off the hot tissue
    const c = board.land[Math.floor(Math.random() * board.land.length)], m = ball(MAT.steam, 0.1 + Math.random() * 0.08, c.x, c.top + 0.1, c.z, false);
    game.fx.push({ mesh: m, vel: new THREE.Vector3((Math.random() - 0.5) * 0.2, 0.7, (Math.random() - 0.5) * 0.2), life: 1.6, t: 0, s: m.scale.x, grav: 0 }); scene.add(m);
  }
  for (const tr of game.traps) { tr.born = Math.min(1, tr.born + dt * 2); tr.mesh.scale.set(elasticOut(tr.born), 1 + 0.08 * Math.sin(game.time * 3 + tr.cell.c), elasticOut(tr.born)); }
  updateGerms(dt); updateTowers(dt); updateTroops(dt); updateShots(dt); updateDrops(dt); updateFx(dt);
  if (game.state === 'wave' && !game.queue.length && !game.germs.length) waveCleared();

  // heart: lub-dub, flinch when hit, jump for joy at the end
  const ph = game.time % 0.9, beat = Math.exp(-(ph ** 2) / 0.003) + 0.6 * Math.exp(-((ph - 0.22) ** 2) / 0.003);
  heart.hit = Math.max(0, heart.hit - dt * 2.5);
  heart.mat.emissiveIntensity = heart.hit * 0.5;
  heart.body.scale.setScalar(1 + 0.07 * beat - 0.12 * heart.hit);
  if (heart.sneeze) {   // breathe in (stretch, lean back)... then ACHOO (squash forward)
    heart.sneeze += dt;
    const t = heart.sneeze, k = t < 0.75 ? t / 0.75 : Math.max(0, 1 - (t - 0.75) / 0.5);
    const stretch = t < 0.75 ? 1 + 0.15 * k : 1 - 0.2 * k;
    heart.body.scale.set(heart.body.scale.x * (2 - stretch), heart.body.scale.y * stretch, heart.body.scale.z);
    heart.body.rotation.x = t < 0.75 ? -0.35 * k : 0.4 * k;
    if (t > 1.25) { heart.sneeze = 0; heart.body.rotation.x = 0; }
  }
  heart.body.position.x = Math.sin(game.time * 60) * 0.06 * heart.hit;
  heart.body.position.y = game.state === 'won' ? Math.abs(Math.sin(game.time * 6)) * 0.35 : 0;

  // pads glow when something can be afforded
  const cheapest = Math.min(...LEVEL.builds.map(k => BUILDS[k].cost));
  const afford = game.energy >= cheapest, glow = 0.35 + 0.35 * (0.5 + 0.5 * Math.sin(game.time * 4));
  for (const p of board.pads) if (!p.tower) p.ring.material.opacity = afford ? glow : 0.18;
  for (const fx of entryFx) fx.arrow.position.y = 1.35 + Math.sin(game.time * 4) * 0.12;

  // red blood cells
  rbcs.forEach((b, i) => {
    b.d = (b.d + dt * b.sp) % b.len; b.spin += dt * 1.5;
    const ix = Math.floor(b.d), f = b.d - ix, a = b.path[ix], c = b.path[ix + 1], dx = c.x - a.x, dz = c.z - a.z;
    const fade = Math.min(1, b.d * 2, (b.len - b.d) * 2);
    dummy.position.set(a.x + dx * f - dz * b.off, ROAD_Y + 0.05, a.z + dz * f + dx * b.off);
    dummy.rotation.set(Math.PI / 2 + Math.sin(b.spin) * 0.5, b.spin, 0);
    dummy.scale.setScalar(Math.max(0.001, fade));
    dummy.updateMatrix(); rbcMesh.setMatrixAt(i, dummy.matrix);
  });
  rbcMesh.instanceMatrix.needsUpdate = true;
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000) * game.timeScale; last = now;
  updateWorld(dt);
  if (view.shake > 0) {   // a little screen shake when the heart gets hit, on a sneeze, and when the King Germ arrives
    view.shake = Math.max(0, view.shake - dt * 2.5);
    const a = view.shake * view.shake * 0.12;
    camera.position.copy(view.base).add(new THREE.Vector3((Math.random() - 0.5) * a, (Math.random() - 0.5) * a, (Math.random() - 0.5) * a));
  } else if (!camera.position.equals(view.base)) camera.position.copy(view.base);
  if (Sound.ctx && !Sound.muted && !document.hidden) Music.set(wantedMood());
  renderer.render(scene, camera);
  updateAnchors();
  requestAnimationFrame(frame);
}

/* ======== boot ======== */
addEventListener('resize', placeCamera);
loadLevel(game.unlocked); game.state = 'title'; showPreview(); updateHud(); renderMap();
requestAnimationFrame(frame);
// #debug exposes a console handle for testing: gg.build(padIndex, kind), gg.step(seconds) runs the game without waiting for frames
if (location.hash === '#debug') window.gg = {
  game, get board() { return board; }, startWave, loadLevel, startLevel,
  build: (i, kind = 'zapper') => { const p = board.pads[i]; if (!p.tower) buildStruct(p, kind); },
  upgrade: i => { const t = board.pads[i].tower; if (t && t.level < 3) upgradeStruct(t); },
  train: i => { const t = board.pads[i].tower; if (t && t.kind === 'nest') t.trainQ++; },
  trap: (c, r) => { const cell = board.cells.get(c + ',' + r); if (cell && cell.ch === '#' && !cell.trap) buildTrap(cell); },
  sneeze, goHome, Music, Haptics,
  unlockAll: () => { game.unlocked = LEVELS.length - 1; store.set('unlocked', game.unlocked); renderMap(); },
  spawn: (kind, entry = 0, dist = 0) => spawnGerm(kind, board.entries[entry].path, dist, dist ? board.entries[entry].path[Math.floor(dist)] : null),
  step: secs => { for (let t = 0; t < secs; t += 1 / 30) updateWorld(1 / 30); renderer.render(scene, camera); updateAnchors(); },
};
</script>
