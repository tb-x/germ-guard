<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Germ Guard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f9bfd0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Germ Guard">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap">
<style>
/* Layout: full-screen isometric board; portrait has the HUD bar on top and the Go button below, wide screens put both in a right-hand column */
:root{
  --ink:#5a1733;
  --panel:rgba(255,255,255,.9);
  --shade:rgba(150,40,80,.2);
  --drop:#39c2ff;
  --heart:#ff3b5c;
  --go:#3fcf6a;
  --go-dark:#23a14b;
  --gold:#ffd23f;
  --title:"Fredoka","Trebuchet MS",sans-serif;
  --plain:Verdana,Tahoma,sans-serif;
  --col:164px;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  font-family:var(--plain);color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  background:
    radial-gradient(circle at 12% 18%,rgba(255,255,255,.55) 0 38px,transparent 40px),
    radial-gradient(circle at 86% 30%,rgba(255,255,255,.35) 0 26px,transparent 28px),
    radial-gradient(circle at 78% 84%,rgba(255,255,255,.3) 0 46px,transparent 48px),
    radial-gradient(circle at 20% 76%,rgba(255,255,255,.25) 0 20px,transparent 22px),
    radial-gradient(120% 90% at 50% 30%,#ffeef3 0%,#f9bfd0 55%,#e07f9f 100%);
  background-color:#f9bfd0;
}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none;margin:0}
#safe{position:fixed;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);visibility:hidden;pointer-events:none}

/* ======== HUD ======== */
.bar{
  position:fixed;left:0;right:0;top:0;z-index:5;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 10px) 0 calc(env(safe-area-inset-left,0px) + 10px);
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;
}
.pill,.round{
  pointer-events:auto;height:48px;border-radius:24px;background:var(--panel);
  box-shadow:0 4px 0 var(--shade),0 8px 18px rgba(150,40,80,.15);
  display:flex;align-items:center;gap:6px;padding:0 12px;box-sizing:border-box;
}
.energy b{font:bold 24px/1 var(--plain);min-width:1.3em;text-align:left}
.energy svg{width:26px;height:26px}
.energy.bump{animation:bump .25s ease-out}
.hearts{gap:2px}
.hearts svg{width:20px;height:20px;transition:transform .2s,opacity .3s,filter .3s}
.hearts .lost{opacity:.3;filter:grayscale(1);transform:scale(.8)}
.waves{gap:5px}
.waves i{width:13px;height:13px;border-radius:50%;border:3px solid #e9a3b9;box-sizing:border-box}
.waves i.done{background:var(--go);border-color:var(--go-dark)}
.waves i.now{background:var(--gold);border-color:#e0a800;animation:pulse 1s ease-in-out infinite}
.round{width:48px;padding:0;justify-content:center;border:0;font-size:22px}
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none;
  height:calc(env(safe-area-inset-bottom,0px) + 104px);
  display:flex;justify-content:center;align-items:flex-start;padding-top:10px;box-sizing:border-box;
}
.go{
  pointer-events:auto;height:78px;min-width:176px;padding:0 30px;border-radius:39px;border:0;
  background:var(--go);color:#fff;font:700 36px/1 var(--title);letter-spacing:.02em;
  box-shadow:0 7px 0 var(--go-dark),0 12px 26px rgba(30,120,60,.3);
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.go:active{transform:translateY(4px);box-shadow:0 3px 0 var(--go-dark),0 6px 14px rgba(30,120,60,.3)}
.go.off{display:none}
.go.sneeze{min-width:0;width:112px;padding:0;font-size:46px;position:relative;overflow:hidden;background:#6cc8ff;box-shadow:0 7px 0 #2e8fd0,0 12px 26px rgba(30,100,160,.3)}
.go.sneeze::after{content:"";position:absolute;inset:0;border-radius:inherit;background:conic-gradient(rgba(20,40,90,.5) calc(var(--cd,0) * 360deg),transparent 0)}
.go.sneeze.ready{animation:ready 1.1s ease-in-out infinite}
@keyframes ready{50%{transform:scale(1.07)}}
.go svg{width:30px;height:30px}
.dock .round{position:absolute;left:calc(env(safe-area-inset-left,0px) + 14px);top:24px;font-size:20px}
body.wide .bar{
  left:auto;bottom:0;width:var(--col);box-sizing:content-box;
  flex-direction:column;flex-wrap:nowrap;justify-content:flex-start;align-items:stretch;
  padding:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-right,0px) + 12px) 0 0;
}
body.wide .pill{justify-content:center}
body.wide .dock{
  left:auto;width:var(--col);height:auto;top:auto;flex-direction:column-reverse;align-items:center;gap:14px;
  padding:0 calc(env(safe-area-inset-right,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 16px) 0;box-sizing:content-box;
}
body.wide .dock .round{position:static}
body.wide .go{min-width:0;width:100%;padding:0;font-size:32px}

/* ======== world labels, build menu, hint hand ======== */
.anchor{position:fixed;left:0;top:0;z-index:4;pointer-events:none;will-change:transform}
.preview{
  transform:translate(-50%,-100%);display:flex;gap:6px;align-items:center;white-space:nowrap;
  background:var(--panel);border-radius:18px;padding:5px 12px 5px 8px;
  box-shadow:0 3px 0 var(--shade);font:bold 20px/1 var(--plain);
}
.preview svg{width:30px;height:30px}
.preview svg.big{width:40px;height:40px}
.hearttag{gap:1px;padding:3px 7px}
.hearttag svg{width:17px;height:17px;transition:transform .2s,opacity .3s,filter .3s}
.hearttag .lost{opacity:.3;filter:grayscale(1);transform:scale(.8)}
.hearttag.low,.hearts.low{animation:low .55s ease-in-out infinite alternate}
@keyframes low{to{box-shadow:0 0 0 5px rgba(255,59,92,.55)}}
.dmg{position:fixed;left:0;top:0;z-index:8;pointer-events:none;white-space:nowrap;font:700 30px/1 var(--title);color:var(--heart);text-shadow:0 2px 0 #fff,0 0 8px #fff;transition:transform 1s ease-out,opacity 1s ease-in}
.nametag{font:700 20px/1 var(--title);padding:8px 14px;color:var(--ink);animation:popin .3s ease-out}
.menu{z-index:6}
.opts{position:absolute;left:0;top:0;transform:translate(-50%,calc(-100% - 34px));display:flex;gap:10px}
.opts::after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-11px;border:11px solid transparent;border-bottom:0;border-top-color:#fff;filter:drop-shadow(0 4px 0 #e7a9bc)}
.opt{
  pointer-events:auto;position:relative;width:96px;min-height:108px;padding:8px 6px;border-radius:26px;border:0;background:#fff;
  box-shadow:0 5px 0 #e7a9bc,0 12px 26px rgba(120,30,60,.28);box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;animation:popin .18s ease-out;
}
.opt .pic{width:66px;height:66px}
.opt .name{font:bold 11px/1 var(--plain);color:#8a4a62;margin-top:-2px}
.opt .cost{display:flex;flex-wrap:wrap;justify-content:center;gap:1px;max-width:82px}
.opt .cost svg{width:14px;height:14px}
.opt .badge{
  position:absolute;right:6px;top:6px;width:30px;height:30px;border-radius:50%;
  background:var(--go);color:#fff;font:bold 20px/30px var(--plain);box-shadow:0 2px 0 var(--go-dark);
}
.opt .pips{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:2px;font-size:12px;line-height:1}
.opt.poor .pic,.opt.poor .cost,.opt.poor .badge{filter:grayscale(.85);opacity:.6}
.opt.shake{animation:shake .4s}
.opts.many .opt{width:84px;min-height:100px}
.opt.sell .badge{background:#ff5a6e;box-shadow:0 2px 0 #c8324a}
.opt.sell .cost::before{content:"+";font:bold 14px/14px var(--plain);color:var(--go-dark);margin-right:1px}
.opt.sell.sure{background:#ffe1e7;box-shadow:0 5px 0 #ff8aa0,0 0 0 4px #ff5a6e;animation:sure .5s ease-in-out infinite alternate}
@keyframes sure{to{transform:scale(1.06)}}
.opts.many .opt .pic{width:56px;height:56px}
.opts.tight{gap:6px} .opts.tight .opt{width:74px} .opts.tight .opt .pic{width:48px;height:48px}
.hand{z-index:7}
.hand span{display:block;font-size:46px;line-height:1;transform:translate(-50%,0);animation:bob .7s ease-in-out infinite alternate;filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}
.hand.down span{transform:translate(-50%,-100%);animation-name:bobdown}
.fly{position:fixed;left:-15px;top:-15px;width:30px;height:30px;z-index:20;pointer-events:none;transition:transform .55s cubic-bezier(.45,-.35,.7,1)}
.fly svg{width:100%;height:100%}

/* ======== title and end cards ======== */
.overlay{
  position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  background:rgba(255,226,236,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
}
.card{
  background:#fff;border-radius:32px;padding:26px 22px 30px;text-align:center;max-width:340px;width:100%;
  box-shadow:0 8px 0 #eaa9bd,0 20px 50px rgba(120,30,60,.25);animation:popin .35s cubic-bezier(.3,1.6,.6,1);
}
.card h1{font:700 52px/1 var(--title);margin:4px 0 6px;color:var(--heart);text-shadow:0 4px 0 #ffd0dc}
.card h2{font:700 30px/1.15 var(--title);margin:6px 0 14px}
.card p{font:16px/1.4 var(--plain);margin:0 0 18px;color:#8a4a62}
.card .art{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:6px 0 10px}
.card .art svg{width:70px;height:70px}
.card .art svg.mid{width:88px;height:88px}
.stars{font-size:46px;letter-spacing:4px;margin:-4px 0 16px}
.stars .off{filter:grayscale(1);opacity:.3}
.card .go{margin:0 auto}
/* the level map: a body with a glowing spot per level */
.title-card{padding-top:20px;position:relative}
.fact{font:15px/1.4 var(--plain);color:#6a3048;background:#fff3c9;border-radius:14px;padding:10px 12px;margin:-4px 0 16px;text-align:left}
.fact b{color:var(--heart)}
/* tip cards: what a new defender does, and how each defender copes with a new germ */
.tipcard{padding:20px 18px 24px}
.tip-head{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:6px}
.tip-head svg{width:72px;height:72px;flex:none}
.tip-head h2{margin:0;text-align:left}
.tip-head small{display:block;font:14px/1.3 var(--plain);color:#8a4a62;margin-top:4px}
.tip-strip{display:flex;align-items:center;justify-content:center;gap:4px;margin:6px 0 10px}
.tip-strip i,.tip-row i{font-style:normal}
.tip-strip svg{width:56px;height:56px}
.tip-strip .arrow{font-size:22px;color:#d58aa4}
.tip-strip .fx{font-size:28px;line-height:1}
.tip-strip .y{font:900 30px/1 var(--title);color:#ff9f1c}
.tip-cap{font:16px/1.35 var(--plain);margin:0 0 16px;color:var(--ink)}
.tip-rows{display:flex;flex-direction:column;gap:7px;margin:8px 0 16px;text-align:left}
.tip-row{display:flex;align-items:center;gap:9px;background:#fff4f7;border-radius:14px;padding:5px 10px}
.tip-row svg{width:40px;height:40px;flex:none}
.tip-row span{font:15px/1.25 var(--plain)}
.mark{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:bold 17px/1 var(--plain);color:#fff;flex:none}
.mark.yes{background:var(--go)} .mark.no{background:#ff5a6e} .mark.star{background:var(--gold);color:#5a3a00}
.credit{font:12px/1.3 var(--plain);color:#b07a8e;margin:12px 0 0}
.credit a{color:inherit}
.row .round.toggle{font-size:24px;box-shadow:0 4px 0 var(--shade)}
.toggle.off{filter:grayscale(1);opacity:.45}
.title-card h1{font-size:46px}
.title-card p{margin-bottom:6px}
.bodymap{position:relative;width:min(270px,70vw);aspect-ratio:200/260;margin:0 auto 12px}
.bodymap svg.body{position:absolute;inset:0;width:100%;height:100%}
.spot{
  position:absolute;transform:translate(-50%,-50%);width:48px;height:48px;padding:0;border-radius:50%;
  border:3px solid #fff;background:#fff6c9;box-shadow:0 3px 0 #e0a800;font-size:24px;line-height:1;display:grid;place-items:center;
}
.spot b{position:absolute;right:-8px;top:-8px;width:22px;height:22px;border-radius:50%;background:var(--heart);color:#fff;font:bold 13px/22px var(--plain)}
.spot .st{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;font-size:12px;letter-spacing:-1px;white-space:nowrap}
.spot .st i{font-style:normal;filter:grayscale(1);opacity:.35}
.spot.locked{background:#f1e6ea;box-shadow:0 3px 0 #cdb5be;filter:grayscale(1);opacity:.7}
.spot.next{animation:glow 1.3s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 3px 0 #e0a800,0 0 0 12px rgba(255,210,63,.4)}}
@media (orientation:landscape) and (max-height:620px){   /* a phone on its side: words and Play on the left, the body on the right */
  .title-card{max-width:600px;display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:20px;padding:16px 22px}
  .title-card .bodymap{grid-column:2;grid-row:1 / span 3;width:auto;height:calc(100vh - 90px);max-height:330px;margin:0}
  .title-card h1{font-size:40px}
}
.row{display:flex;gap:10px;justify-content:center;align-items:center}
.row .go{margin:0;min-width:0;padding:0 22px;font-size:30px;white-space:nowrap;flex:0 1 auto}
.row .round{width:58px;height:58px;font-size:0;flex:none}
.row .round svg{width:30px;height:30px}
.dock .round.home{left:auto;right:calc(env(safe-area-inset-right,0px) + 14px)}
.dock .round.home svg{width:24px;height:24px}
.dock .round.speed{left:auto;right:calc(env(safe-area-inset-right,0px) + 74px);font:bold 18px/1 var(--plain);color:#8a4a62}
.dock .round.speed.on{background:var(--gold);color:#5a3a00;box-shadow:0 4px 0 #e0a800,0 0 0 3px #fff6c9}

@keyframes pulse{50%{transform:scale(1.3)}}
@keyframes bump{50%{transform:scale(1.18)}}
@keyframes bob{to{transform:translate(-50%,12px)}}
@keyframes bobdown{to{transform:translate(-50%,calc(-100% - 12px))}}
@keyframes popin{from{transform:scale(.6);opacity:0}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ======== home button (back to all games) ======== */
#home{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));z-index:50;
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#2a2140;background:rgba(255,255,255,.82);
  box-shadow:0 3px 0 rgba(0,0,0,.18);touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-decoration:none}
#home svg{width:24px;height:24px}
#home:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
@media (max-width:539px){   /* a phone held upright: the top bar fills the width, so the button sits just under it */
  body:not(.wide) #home{top:calc(env(safe-area-inset-top,0px) + 66px)}
}
</style>
</head>
<body>
<a id="home" href="../index.html" aria-label="All games" title="All games"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 9.8V20h12V9.8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M10 20v-5.5h4V20" fill="currentColor"/></svg></a>
<canvas id="scene"></canvas>
<div id="safe"></div>

<div class="bar" id="bar">
  <div class="pill energy" id="energyPill" aria-label="Energy drops"><span id="energyIcon"></span><b id="energy">0</b></div>
  <div class="pill hearts" id="hearts" aria-label="Heart sparkles"></div>
  <div class="pill waves" id="waves" aria-label="Waves"></div>
</div>
<div class="dock" id="dock">
  <button class="go" id="go" aria-label="Send the next wave">Go!</button>
  <button class="go sneeze off" id="sneeze" aria-label="Sneeze the germs away">🤧</button>
  <button class="round" id="mute" aria-label="Sound on or off">🔊</button>
  <button class="round home" id="mapHome" aria-label="Back to the map"></button>
  <button class="round speed" id="speed" aria-label="Play faster" aria-pressed="false" hidden>2×</button>
</div>

<div id="labels"></div>
<div class="anchor menu" id="menu" hidden><div class="opts" id="opts"></div></div>
<div class="anchor hand" id="hand" hidden><span>👆</span></div>
<div class="anchor" id="heartTag" hidden><div class="preview hearttag" id="heartTagBody"></div></div>
<div class="anchor" id="nametag" hidden><div class="preview nametag"></div></div>

<div class="overlay" id="title">
  <div class="card title-card">
    <h1>Germ Guard</h1>
    <p>Build white blood cells. Stop the germs before they reach the heart!</p>
    <div class="bodymap" id="bodymap"></div>
    <div class="row">
      <button class="go" id="play" aria-label="Play"></button>
      <button class="round toggle" id="music" aria-label="Music on or off">🎵</button>
      <button class="round toggle" id="vibe" aria-label="Vibration on or off" hidden>📳</button>
    </div>
    <p class="credit">Voices and sounds: <a href="https://elevenlabs.io" target="_blank" rel="noopener">elevenlabs.io</a></p>
  </div>
</div>
<div class="overlay" id="tip" hidden>
  <div class="card tipcard">
    <div id="tipBody"></div>
    <button class="go" id="tipOk" aria-label="Got it">OK 👍</button>
  </div>
</div>
<div class="overlay" id="end" hidden>
  <div class="card">
    <div class="art" id="endArt"></div>
    <h2 id="endTitle"></h2>
    <div class="stars" id="stars"></div>
    <p class="fact" id="endFact" hidden></p>
    <div class="row">
      <button class="round" id="mapBtn" aria-label="Back to the map"></button>
      <button class="round" id="againBtn" aria-label="Play this level again"></button>
      <button class="go" id="endBtn"></button>
    </div>
    <p class="credit">Voices and sounds: <a href="https://elevenlabs.io" target="_blank" rel="noopener">elevenlabs.io</a></p>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js';

/* ======== tuning knobs ======== */
const HEART_SPARKLES = 5;       // germs that may reach the heart before the wave has to be tried again
const WAVE_BONUS = 3;           // drops that pop out of the heart after each cleared wave
const DROP_AUTOCOLLECT_S = 4;   // a drop nobody taps flies to the counter on its own after this long
const SHOT_SPEED = 9;           // zapper shots, tiles per second
const BUILDS = {                // what can go on a pad: its cost in drops, and two upgrade paths (each step can be bought twice)
  zapper: { cost: 5, grow: 'power', tracks: {   // shoots bubbles at germs
    reach: { label: 'Reach', badge: '◎', pip: '🔵', costs: [5, 8], steps: [{ range: 2.7 }, { range: 3.0 }, { range: 3.3 }] },   // how far it shoots, in tiles
    power: { label: 'Power', badge: '⚡', pip: '⚡', costs: [6, 9], steps: [   // seconds between shots, damage per shot
      { reload: 0.85, damage: 1 }, { reload: 0.6, damage: 1 }, { reload: 0.8, damage: 2 }] },
  } },
  nest: { cost: 6, grow: 'bite', base: { reach: 2.3 }, tracks: {   // trains blobs that guard the vessel within `reach` tiles
    bite:   { label: 'Bite',   badge: '🦷', pip: '🦷', costs: [6, 9], steps: [{ dps: 1.8 }, { dps: 2.4 }, { dps: 3.0 }] },        // blob damage per second
    energy: { label: 'Energy', badge: '🔋', pip: '🔋', costs: [5, 8], steps: [{ stamina: 8 }, { stamina: 11 }, { stamina: 14 }] },  // how long a blob can hold germs
  } },
  antibody: { cost: 6, grow: 'speed', tracks: {   // throws antibodies that stick on germs
    reach: { label: 'Reach', badge: '◎', pip: '🔵', costs: [5, 8], steps: [{ range: 2.8 }, { range: 3.1 }, { range: 3.4 }] },
    speed: { label: 'Speed', badge: '⚡', pip: '⚡', costs: [6, 9], steps: [   // seconds between throws, germs per throw
      { reload: 1.4, multi: 1 }, { reload: 1.0, multi: 1 }, { reload: 0.9, multi: 2 }] },
  } },

function parseBoard(map) {
  const b = { cells: new Map(), land: [], pads: [], entries: [], heart: null };
  map.forEach((row, r) => [...row].forEach((ch, c) => {
    if (ch === ' ') return;
    const cell = { c, r, ch, x: c, z: r, top: 0 };
    b.cells.set(c + ',' + r, cell); b.land.push(cell);
    if (ch === 'o' || (ch >= 'b' && ch <= 'e')) {   // a pad; 'b'-'e' are pads that open up before wave 2-5

    }

    if (ch === 'H') b.heart = cell;
  }));
  for (const e of b.entries) {
    e.path = findPath(b, e, b.heart);
    if (e.path.length < 2 || !e.path[0].equals(new THREE.Vector3(e.x, 0, e.z))) throw new Error(`Germ Guard map: entry ${e.ch} can't reach the heart`);
  }

}
function findPath(b, from, to) {   // breadth-first search along the vessel tiles
  const key = c => c.c + ',' + c.r, prev = new Map([[key(from), null]]), queue = [from];
  while (queue.length) {
    const cur = queue.shift(); if (cur === to) break;
    for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const n = b.cells.get((cur.c + dc) + ',' + (cur.r + dr));
      if (n && isRoad(n.ch) && !prev.has(key(n))) { prev.set(key(n), cur); queue.push(n); }
    }

  const path = [];
  for (let c = to; c; c = prev.get(key(c))) path.unshift(new THREE.Vector3(c.x, 0, c.z));

}

function loadLevel(i) {

  const tiles = new THREE.InstancedMesh(new THREE.BoxGeometry(0.97, TILE_H, 0.97).translate(0, -TILE_H / 2, 0), toon(0xffffff), board.land.length);
  tiles.receiveShadow = true;

    const skin = isEntry(cell.ch) || (!road && board.entries.some((e, i) => entryStyle(i) === 'nostril' && Math.abs(e.c - cell.c) <= 1 && Math.abs(e.r - cell.r) <= 1));

    disc(2.4, 0x5aa9e6, 0.075); disc(2.1, 0x7cc4f5, 0.08); disc(1.05, 0x22223a, 0.085);

    eye.position.set(ix, 0, iz); world.add(eye);

/* ======== progress ======== */
// Best stars are saved per level id, so levels can be added or reordered without mixing anything up.
// A level is open once the one before it has been won (or it has stars of its own).
function loadStars() {
  const saved = store.get('stars', {});
  if (!Array.isArray(saved)) return saved;
  const old = ['knee', 'nose', 'tummy', 'lungs', 'fever'], stars = {};   // the first published version saved a list in this order
  saved.forEach((n, i) => { if (n) stars[old[i]] = n; });
  store.set('stars', stars);

}
const isOpen = i => game.cheat || i === 0 || !!game.stars[LEVELS[i - 1].id] || !!game.stars[LEVELS[i].id];
const newestOpen = () => { let i = 0; while (i + 1 < LEVELS.length && isOpen(i + 1)) i++; return i; };

/* ======== game state ======== */
const game = {

}

}
function resetLevelState() {

  for (const p of board.pads) {   // later building spots stay hidden until their wave comes round

  for (let i = 0; i < WAVE_BONUS; i++) spawnDrop(heartPos, 1.4 + i * 0.15);

}
function showHeartHealth() {   // plasters and a face that match how many hearts are left

  heart.plasters.forEach((pl, i) => { pl.visible = i < lost; });
  const mood = game.sparkles >= HEART_SPARKLES - 1 ? 'smile' : game.sparkles >= 2 ? 'flat' : 'frown';

}
function floatDamage(amount) {   // "💔 -1" floats up from the heart
  const p = toScreen(heartPos.x, heartPos.y + 0.9, heartPos.z), el = document.createElement('div');
  el.className = 'dmg'; el.textContent = '💔 -' + amount;
  el.style.transform = `translate(${p.x}px,${p.y}px) translate(-50%,-50%)`;
  document.body.append(el);
  requestAnimationFrame(() => requestAnimationFrame(() => { el.style.transform = `translate(${p.x}px,${p.y - 70}px) translate(-50%,-50%) scale(1.2)`; el.style.opacity = '0'; }));

/* ======== germs ======== */
function spawnGerm(kind, path, dist = 0, at = null) {   // at: start above ground at this point (germs that split off), else rise out of the entry
  const k = GERMS[kind], m = makeGerm(k);
  if (k.hurts > 1 && !at) { Sound.boss(); view.shake = 0.7; }
  const maxHp = k.hp * (LEVEL.toughness || 1);   // some levels have tougher germs
  const g = { k, ...m, hp: maxHp, maxHp, path, end: path.length - 1.6, dist, off: (Math.random() - 0.5) * 0.26, heldBy: null, tagged: false, abIncoming: false, blow: null,
    rise: at ? 1 : 0, phase: Math.random() * 6, flash: 0, clink: 0, leaving: -1, from: new THREE.Vector3(), target: new THREE.Vector3() };
  if (at) g.mesh.position.copy(at).setY(ROAD_Y); else g.mesh.position.set(path[0].x, ROAD_Y - 0.6, path[0].z);
  g.mesh.rotation.y = view.yaw;
  scene.add(g.mesh); game.germs.push(g);
  return g;
}
function inMucus(g) {
  const p = g.mesh.position;
  return game.traps.some(tr => Math.hypot(tr.cell.x - p.x, tr.cell.z - p.z) < MUCUS_R);
}
function pathPoint(g, out) {   // position along the path, nudged sideways by the germ's lane offset; returns the heading
  const p = g.path, i = Math.min(Math.floor(g.dist), p.length - 2), f = g.dist - i, a = p[i], b = p[i + 1];
  const dx = b.x - a.x, dz = b.z - a.z;
  out.set(a.x + dx * f - dz * g.off, 0, a.z + dz * f + dx * g.off);
  return Math.atan2(dx, dz);

function updateGerms(dt) {
  const moving = game.state === 'wave';
  for (const g of [...game.germs]) {
    if (g.heldBy && g.heldBy.foe !== g) g.heldBy = null;
    g.phase += dt * 10 * g.k.speed;
    g.flash = Math.max(0, g.flash - dt * 6); g.mat.emissiveIntensity = g.flash * 0.7;
    const shrink = 0.7 + 0.3 * Math.max(0, g.hp) / g.maxHp;
    if (g.leaving >= 0) {   // jumping into the heart
      g.leaving = Math.min(1, g.leaving + dt * 2.4);
      const t = g.leaving;
      g.mesh.position.lerpVectors(g.from, heartPos, t); g.mesh.position.y += Math.sin(t * Math.PI) * 0.8;
      g.mesh.scale.setScalar(shrink * (1 - t * 0.7));
      if (t >= 1) { removeGerm(g); heartHit(g.k.hurts || 1); }
      continue;
    }
    if (g.blow) {   // blown back by a sneeze, tumbling
      g.blow.t = Math.min(1, g.blow.t + dt / 0.7);
      const e = 1 - (1 - g.blow.t) ** 3;
      g.dist = g.blow.from + (g.blow.to - g.blow.from) * e;
      g.inner.rotation.x = -g.blow.t * Math.PI * 4;
      if (g.blow.t >= 1) { g.blow = null; g.inner.rotation.x = 0; }
    } else if (moving && !g.heldBy) {
      g.dist += g.k.speed * (g.tagged ? TAG_SLOW : 1) * (inMucus(g) ? MUCUS_SLOW : 1) * dt;
      if (g.dist >= g.end) { g.leaving = 0; g.from.copy(g.mesh.position); continue; }
    }
    g.rise = Math.min(1, g.rise + dt * 1.8);
    const heading = pathPoint(g, g.target);
    const pos = g.mesh.position, k = damp(12, dt);
    pos.x += (g.target.x - pos.x) * k; pos.z += (g.target.z - pos.z) * k;
    pos.y = ROAD_Y - (1 - g.rise) * 0.6;
    g.mesh.rotation.y = lerpAngle(g.mesh.rotation.y, moving ? heading : view.yaw, damp(8, dt));
    const hop = g.heldBy ? 0.3 : Math.abs(Math.sin(g.phase)), sq = 1 - 0.14 * Math.cos(g.phase * 2);
    g.inner.position.y = hop * 0.1;
    g.inner.rotation.z = g.heldBy ? Math.sin(game.time * 28) * 0.18 : 0;   // struggling in a blob's grip
    g.inner.rotation.y = g.k.shape === 'rod' ? Math.sin(g.phase * 1.6) * 0.35 : 0;   // wigglers wiggle

}
function damageGerm(g, dmg) {

function popGerm(g) {

    const a = Math.random() * Math.PI * 2, sp = 1.5 + Math.random() * 2;

/* ======== defenders: zappers and nests ======== */
function buildStruct(pad, kind) {

  t.group.position.set(pad.x, pad.top + 0.08, pad.z);
  t.aim.rotation.y = view.yaw; t.group.scale.setScalar(0.01);
  pad.tower = t; pad.plus.visible = pad.ring.visible = false;
  scene.add(t.group); game.towers.push(t);
  if (kind === 'nest') { choosePosts(t); t.trainQ = 1; }
  burst(new THREE.Vector3(pad.x, pad.top + 0.3, pad.z), 8, 0.3, [MAT.shot], 2.5);
}

}

  if (t.extras) t.body.remove(t.extras);

  if (t.halo) t.group.remove(t.halo);
  const x = t.extras = new THREE.Group(); t.body.add(x);
  t.halo = new THREE.Group(); t.halo.position.y = 1.18; t.group.add(t.halo);   // one star per upgrade

  }

    if (u.power === 2) lobes.push([-0.09, 0.72, -0.05, 0.1], [0.09, 0.72, -0.05, 0.1]);
    for (const [px, py, pz, r] of lobes) x.add(ball(MAT.lobe, r, px, py, pz));
    if (u.power === 2) { const aura = ball(MAT.aura, 1, 0, 0.36, 0, false); aura.scale.set(0.5, 0.48, 0.5); x.add(aura); }

function spawnDrop(at, life) {

function updateDrops(dt) {

    if (d.vel) {
      d.mesh.position.addScaledVector(d.vel, dt); d.vel.y -= 12 * dt;

    } else {

  heart.body.position.y = game.state === 'won' ? Math.abs(Math.sin(game.time * 6)) * 0.35 : 0;

  // pads glow when something can be afforded
  const cheapest = Math.min(...LEVEL.builds.map(k => BUILDS[k].cost));
  const afford = game.energy >= cheapest, glow = 0.35 + 0.35 * (0.5 + 0.5 * Math.sin(game.time * 4));
  for (const p of board.pads) {
    if (!p.tower) p.ring.material.opacity = afford ? glow : 0.18;
    if (p.born < 1) {   // a new spot springs up
      p.born = Math.min(1, p.born + dt * 1.5); const k = Math.max(0.01, elasticOut(p.born));
      p.plate.scale.setScalar(k); p.plus.scale.setScalar(k); p.ring.scale.setScalar(k);
    }
  }
  if (game.spotHint) { game.spotHint.t -= dt; if (game.spotHint.t <= 0 || game.state !== 'build' || game.spotHint.pad.tower) game.spotHint = null; }
  for (const fx of entryFx) fx.arrow.position.y = 1.35 + Math.sin(game.time * 4) * 0.12;

  // red blood cells
  rbcs.forEach((b, i) => {
    b.d = (b.d + dt * b.sp) % b.len; b.spin += dt * 1.5;
    const ix = Math.floor(b.d), f = b.d - ix, a = b.path[ix], c = b.path[ix + 1], dx = c.x - a.x, dz = c.z - a.z;
    const fade = Math.min(1, b.d * 2, (b.len - b.d) * 2);
    dummy.position.set(a.x + dx * f - dz * b.off, ROAD_Y + 0.05, a.z + dz * f + dx * b.off);
    dummy.rotation.set(Math.PI / 2 + Math.sin(b.spin) * 0.5, b.spin, 0);
    dummy.scale.setScalar(Math.max(0.001, fade));
    dummy.updateMatrix(); rbcMesh.setMatrixAt(i, dummy.matrix);
  });
  rbcMesh.instanceMatrix.needsUpdate = true;
}
let last = performance.now();
function frame(now) {
  const fast = game.fast && game.state === 'wave' ? FAST_SPEED : 1;   // the 2× button speeds up waves only
  const dt = Math.min(0.05, (now - last) / 1000) * game.timeScale * fast; last = now;
  updateWorld(dt);
  if (view.shake > 0) {   // a little screen shake when the heart gets hit, on a sneeze, and when the King Germ arrives
    view.shake = Math.max(0, view.shake - dt * 2.5);
    const a = view.shake * view.shake * 0.12;
    camera.position.copy(view.base).add(new THREE.Vector3((Math.random() - 0.5) * a, (Math.random() - 0.5) * a, (Math.random() - 0.5) * a));
  } else if (!camera.position.equals(view.base)) camera.position.copy(view.base);
  if (Sound.ctx && !Sound.muted && !document.hidden) Music.set(wantedMood());
  renderer.render(scene, camera);
  updateAnchors();
  requestAnimationFrame(frame);
}

/* ======== boot ======== */
addEventListener('resize', placeCamera);
loadLevel(newestOpen()); game.state = 'title'; showPreview(); updateHud(); renderMap();
requestAnimationFrame(frame);
// #debug exposes a console handle for testing: gg.build(padIndex, kind), gg.step(seconds) runs the game without waiting for frames
if (location.hash === '#debug') window.gg = {
  game, get board() { return board; }, startWave, loadLevel, startLevel,
  build: (i, kind = 'zapper') => { const p = board.pads[i]; if (!p.tower) buildStruct(p, kind); },
  upgrade: (i, track) => {   // one step on a path ('reach', 'power', 'bite', 'energy', 'speed'); by default the one that grows it
    const t = board.pads[i].tower; if (!t) return;
    const k = track || BUILDS[t.kind].grow;
    if (t.ups[k] < 2) upgradeTrack(t, k, BUILDS[t.kind].tracks[k].costs[t.ups[k]]);
  },
  train: i => { const t = board.pads[i].tower; if (t && t.kind === 'nest') t.trainQ++; },
  trap: (c, r) => { const cell = board.cells.get(c + ',' + r); if (cell && cell.ch === '#' && !cell.trap) buildTrap(cell); },
  sneeze, goHome, Music, Haptics, Sound, Speech, openMenu, BUILDS, get level() { return LEVEL; },
  unlockAll: () => { game.cheat = true; renderMap(); },
  spawn: (kind, entry = 0, dist = 0) => spawnGerm(kind, board.entries[entry].path, dist, dist ? board.entries[entry].path[Math.floor(dist)] : null),
  step: secs => { for (let t = 0; t < secs; t += 1 / 30) updateWorld(1 / 30); renderer.render(scene, camera); updateAnchors(); },
};
</script>
<script>
// Offline support: sw.js caches this page. Once the page has loaded, send it every file the page used (fonts,
// three.js) so those work offline too. Fails quietly where unsupported, e.g. on file://.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then((reg) => {
    const send = () => reg.active && reg.active.postMessage({ cache: [location.href, ...performance.getEntriesByType('resource').map((r) => r.name)] });
    send(); setTimeout(send, 5000); setTimeout(send, 20000);
  }).catch(() => {});
}
</script>
